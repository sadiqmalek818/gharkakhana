<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2B1B17">
<title>GharKaKhana — Admin Panel</title>

<!-- PWA: makes "Add to Home Screen" work -->
<link rel="manifest" href="manifest-admin.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GKK Admin">
<link rel="apple-touch-icon" href="icon-192-admin.png">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- Firebase (Firestore) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root{
    --charcoal:#2B1B17; --card:#3D2A22; --turmeric:#E8A93D; --chili:#B54834;
    --cream:#FBF3E7; --tan:#EFE1CC; --sage:#7A8B69; --text-muted:#5A4632; --text-soft:#8A7256;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; background:var(--cream); color:var(--charcoal);}
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:700;}
  .wrap{max-width:480px; margin:0 auto; padding:0 18px 100px;}

  .topbar{background:var(--charcoal); color:var(--cream); padding:16px 0; position:sticky; top:0; z-index:20;}
  .topbar .wrap{display:flex; align-items:center; justify-content:space-between; padding-bottom:0;}
  .brand{font-family:'Fraunces',serif; font-weight:700; font-size:17px; display:flex; align-items:center; gap:6px;}
  .brand i{color:var(--turmeric);}
  .subtitle{font-size:10.5px; color:#C9B79C; text-transform:uppercase; letter-spacing:0.14em;}

  .tabs{display:flex; gap:6px; margin:16px 0 14px; padding:0 18px; max-width:480px; margin-left:auto; margin-right:auto;}
  .tab{
    flex:1; text-align:center; padding:9px 4px; border-radius:11px; font-size:11px; font-weight:700;
    background:white; border:1px solid var(--tan); color:var(--text-muted); cursor:pointer;
  }
  .tab i{display:block; margin-bottom:2px; font-size:12px;}
  .tab.active{background:var(--charcoal); color:var(--cream); border-color:var(--charcoal);}

  .stat-row{display:flex; gap:10px; margin-bottom:16px;}
  .stat{flex:1; background:var(--card); color:var(--cream); border-radius:14px; padding:12px; text-align:center;}
  .stat b{display:block; font-size:17px;}
  .stat span{font-size:10px; color:#C9B79C;}

  .add-bar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .add-bar h2{font-size:16px;}
  .btn{
    border:none; cursor:pointer; font-weight:700; border-radius:12px; font-size:12.5px;
    padding:10px 16px; transition:transform .15s;
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{background:var(--chili); color:var(--cream);}
  .btn-ghost{background:var(--tan); color:var(--text-muted);}
  .btn-sm{padding:7px 12px; font-size:11.5px;}
  .btn i{margin-right:6px;}

  .card{background:white; border:1px solid var(--tan); border-radius:18px; padding:14px; margin-bottom:12px;}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .avatar{
    width:38px; height:38px; border-radius:50%; background:var(--tan); color:var(--chili);
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex:0 0 auto;
  }
  .info{flex:1; min-width:0;}
  .name{font-size:13.5px; font-weight:700;}
  .meta{font-size:11px; color:var(--text-soft); margin-top:1px;}
  .badge{font-size:10px; font-weight:700; padding:4px 9px; border-radius:999px; white-space:nowrap;}
  .badge.active{background:#E7EDE1; color:var(--sage);}
  .badge.inactive{background:var(--tan); color:var(--text-soft);}
  .row-actions{display:flex; gap:8px; margin-top:12px;}
  .icon-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:5px;
    padding:8px; border-radius:10px; font-size:11.5px; font-weight:700; cursor:pointer; border:1px solid var(--tan);
    background:var(--cream); color:var(--text-muted);
  }
  .icon-btn.danger{color:var(--chili); border-color:#F0D9CF;}

  .empty{text-align:center; padding:30px 10px; color:var(--text-soft); font-size:12.5px;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(43,27,23,0.55); display:none;
    align-items:flex-end; justify-content:center; z-index:100;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--cream); width:100%; max-width:480px; border-radius:24px 24px 0 0;
    padding:20px 18px 26px; animation:slideup .2s ease;
  }
  @keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal h3{font-size:16px; margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{font-size:11px; font-weight:600; color:var(--text-muted); display:block; margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--tan);
    font-size:13px; font-family:'Inter',sans-serif; background:white; color:var(--charcoal); resize:vertical;
  }
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .modal-actions .btn{flex:1;}

  .photo-picker{display:flex; align-items:center; gap:10px;}
  .photo-preview{width:52px; height:52px; border-radius:12px; object-fit:cover; border:1px solid var(--tan); background:var(--tan);}
  .file-btn{background:var(--tan); color:var(--text-muted); font-size:11.5px; font-weight:700; padding:10px 14px; border-radius:10px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;}
  .file-btn:active{transform:scale(0.97);}
  .avatar img{width:100%; height:100%; border-radius:50%; object-fit:cover;}
  .avatar.sq img{border-radius:12px;}

  .settings-card{background:white; border:1px solid var(--tan); border-radius:18px; padding:16px; margin-bottom:14px;}
  .settings-card h3{font-size:14px; margin-bottom:4px;}
  .settings-card p{font-size:11.5px; color:var(--text-soft); margin-bottom:12px; line-height:1.5;}
  .settings-qr-preview{width:140px; height:140px; border-radius:14px; object-fit:cover; background:var(--tan); display:block; margin-bottom:12px;}
  .chip-list{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;}
  .chip{background:var(--tan); color:var(--text-muted); font-size:11.5px; font-weight:600; padding:6px 8px 6px 12px; border-radius:999px; display:flex; align-items:center; gap:8px;}
  .chip i{cursor:pointer; color:var(--chili); font-size:10px;}
  .chip-add-row{display:flex; gap:8px;}
  .chip-add-row input{flex:1; padding:9px 12px; border-radius:10px; border:1px solid var(--tan); font-size:12.5px; font-family:'Inter',sans-serif;}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--charcoal); color:var(--cream); padding:10px 18px; border-radius:999px;
    font-size:12px; font-weight:600; z-index:200; opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .toast.show{opacity:1;}

  /* Calendar */
  .cal-box{background:white; border:1px solid var(--tan); border-radius:18px; padding:14px; margin-bottom:16px;}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cal-head b{font-size:13px; font-family:'Fraunces',serif;}
  .cal-nav{width:28px; height:28px; border-radius:8px; background:var(--tan); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center;}
  .cal-dow{font-size:9.5px; font-weight:700; color:var(--text-soft); padding-bottom:4px;}
  .cal-day{
    position:relative; aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    font-size:11px; border-radius:9px; cursor:pointer; color:var(--charcoal);
  }
  .cal-day.other-month{color:var(--tan); cursor:default;}
  .cal-day.today{font-weight:800; border:1.5px solid var(--chili);}
  .cal-day.selected{background:var(--charcoal); color:var(--cream);}
  .cal-dot{position:absolute; bottom:3px; width:5px; height:5px; border-radius:50%;}
  .cal-dot.pending{background:var(--chili);}
  .cal-dot.confirmed{background:var(--sage);}

  .order-card{background:white; border:1px solid var(--tan); border-radius:16px; padding:13px; margin-bottom:10px;}
  .order-card.urgent{border-color:var(--chili); border-width:1.5px;}
  .order-item{font-size:12.5px; font-weight:700;}
  .order-meta{font-size:10.5px; color:var(--text-soft); margin-top:3px;}
  .urgent-tag{background:var(--chili); color:white; font-size:9px; font-weight:800; padding:2px 7px; border-radius:999px; margin-left:6px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div>
      <div class="brand"><i class="fa-solid fa-bowl-food"></i> GharKaKhana</div>
      <div class="subtitle">Admin Panel</div>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <div id="installBtn" onclick="installApp()" style="display:flex; align-items:center; gap:5px; cursor:pointer; font-size:10.5px; font-weight:700; color:var(--turmeric); border:1px solid #5A4632; padding:5px 9px; border-radius:999px;">
        <i class="fa-solid fa-download"></i> Install
      </div>
      <i class="fa-solid fa-user-shield" style="color:#C9B79C; font-size:18px;"></i>
    </div>
  </div>
</div>

<div id="configBanner" style="display:none; background:#F6E2DC; color:var(--chili); font-size:11.5px; font-weight:600; text-align:center; padding:9px 16px;">
  ⚠️ Firebase config nahi bhara — abhi local demo mode mein hai (changes save nahi honge, refresh pe reset ho jayenge).
</div>

<div class="overlay" id="qrOverlay">
  <div class="modal" id="qrModal"></div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="cooks" onclick="switchTab('cooks')"><i class="fa-solid fa-kitchen-set"></i> Cooks</div>
  <div class="tab" data-tab="riders" onclick="switchTab('riders')"><i class="fa-solid fa-motorcycle"></i> Riders</div>
  <div class="tab" data-tab="menu" onclick="switchTab('menu')"><i class="fa-solid fa-utensils"></i> Menu</div>
  <div class="tab" data-tab="orders" onclick="switchTab('orders')"><i class="fa-solid fa-calendar-check"></i> Orders</div>
  <div class="tab" data-tab="settings" onclick="switchTab('settings')"><i class="fa-solid fa-gear"></i> Settings</div>
</div>

<div class="wrap">
  <div class="stat-row" id="statRow"></div>

  <div class="add-bar" id="addBar">
    <h2 id="sectionTitle">Cooks</h2>
    <button class="btn btn-primary" id="addBtn" onclick="openModal()"><i class="fa-solid fa-plus"></i>Add</button>
  </div>

  <div id="calendarBox" style="display:none;"></div>

  <div id="settingsBox" style="display:none;"></div>

  <div id="list"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Naya Cook Add Karo</h3>
    <div id="entryForm">
      <div class="field">
        <label>Naam</label>
        <input type="text" id="f_name" required placeholder="e.g. Naseem Ben">
      </div>
      <div class="field">
        <label>Locality / Area</label>
        <input type="text" id="f_area" required placeholder="e.g. Shah-e-Alam">
      </div>
      <div class="field">
        <label>Phone</label>
        <input type="tel" id="f_phone" required placeholder="e.g. 98765 43210">
      </div>
      <div class="field" id="f_photoField">
        <label>Photo</label>
        <div class="photo-picker">
          <img id="f_photoPreview" class="photo-preview" style="display:none;">
          <label class="file-btn" for="f_photo"><i class="fa-solid fa-camera"></i>Photo chuno</label>
          <input type="file" accept="image/*" id="f_photo" onchange="handlePhotoPick(this,'f_photoPreview')" style="display:none;">
        </div>
      </div>
      <div class="field" id="f_qrField">
        <label>Settlement QR (cook ka apna QR — sirf admin ke record ke liye, customer ko nahi dikhta)</label>
        <div class="photo-picker">
          <img id="f_qrPreview" class="photo-preview" style="display:none;">
          <label class="file-btn" for="f_qr"><i class="fa-solid fa-camera"></i>QR chuno</label>
          <input type="file" accept="image/*" id="f_qr" onchange="handlePhotoPick(this,'f_qrPreview')" style="display:none;">
        </div>
      </div>
      <div class="field">
        <label>Status</label>
        <select id="f_status">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
      <div id="formError" style="display:none; color:var(--chili); font-size:11.5px; font-weight:600; margin-bottom:8px;"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveEntry()">Save</button>
      </div>
    </div>

    <div id="menuForm" style="display:none;">
      <div class="field">
        <label>Item ka naam</label>
        <input type="text" id="m_name" placeholder="e.g. Mohanthal">
      </div>
      <div class="field">
        <label>Photo</label>
        <div class="photo-picker">
          <img id="m_photoPreview" class="photo-preview" style="display:none;">
          <label class="file-btn" for="m_photo"><i class="fa-solid fa-camera"></i>Photo chuno</label>
          <input type="file" accept="image/*" id="m_photo" onchange="handlePhotoPick(this,'m_photoPreview')" style="display:none;">
        </div>
      </div>
      <div class="field">
        <label>Cook</label>
        <select id="m_cook"></select>
      </div>
      <div class="field">
        <label>Type</label>
        <select id="m_type">
          <option value="veg">Veg</option>
          <option value="nonveg">Non-Veg</option>
        </select>
      </div>
      <div class="field">
        <label>Category</label>
        <select id="m_category"></select>
      </div>
      <div class="field">
        <label>Unit</label>
        <select id="m_unit"></select>
      </div>
      <div class="field">
        <label>Price (₹)</label>
        <input type="number" id="m_price" placeholder="e.g. 260">
      </div>
      <div class="field">
        <label>Status</label>
        <select id="m_status">
          <option value="active">Available</option>
          <option value="inactive">Paused</option>
        </select>
      </div>
      <div id="menuFormError" style="display:none; color:var(--chili); font-size:11.5px; font-weight:600; margin-bottom:8px;"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn btn-primary" onclick="saveMenuItem()">Save</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // In-memory data (no backend yet — connect a real database for production)
  function todayISO(){
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }
  function addDaysISO(n){
    const d = new Date();
    d.setDate(d.getDate() + n);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }

  // data.* is now populated LIVE from Firestore (see initFirestoreListeners below).
  // SEED is only used once, to pre-fill an empty database so the app isn't blank on first run.
  let data = { cooks: [], riders: [], menu: [], orders: [] };
  let settings = {
    qrUrl: "",
    categories: [
      { key: "thali", label: "Thali", estimateMode: "normal" },
      { key: "roti", label: "Roti & Mande", estimateMode: "normal" },
      { key: "nashta", label: "Nashta", estimateMode: "normal" },
      { key: "chai", label: "Chai", estimateMode: "none" },
      { key: "mithai", label: "Mithai", estimateMode: "light" },
      { key: "cake", label: "Cake", estimateMode: "none" },
    ],
    units: [
      { key: "kg", label: "Per kg" },
      { key: "piece", label: "Per piece", servesPeople: 1 },
      { key: "cup", label: "Per cup", servesPeople: 1 },
      { key: "box", label: "Per box (4 person)", servesPeople: 4 },
    ],
    occasions: [
      { key: "lunch", label: "Lunch", icon: "fa-sun", cutoffTime: "10:00" },
      { key: "dinner", label: "Dinner", icon: "fa-moon", cutoffTime: "18:00" },
      { key: "urgent", label: "Urgent", icon: "fa-bolt", cutoffTime: "" },
    ],
    events: [
      { key: "mangni", label: "Mangni", icon: "fa-ring" },
      { key: "birthday_party", label: "Birthday Party", icon: "fa-cake-candles" },
      { key: "ziyarat", label: "Ziyarat", icon: "fa-mosque" },
      { key: "niyaz", label: "Niyaz", icon: "fa-hands-praying" },
      { key: "farmhouse_delivery", label: "Farmhouse Delivery", icon: "fa-tree" },
      { key: "yaad", label: "Yaad", icon: "fa-dove" },
    ],
    localities: [
      { key: "shah_e_alam", label: "Shah-e-Alam" },
      { key: "gomtipur", label: "Gomtipur" },
      { key: "bapunagar", label: "Bapunagar" },
      { key: "juhapura", label: "Juhapura" },
      { key: "jamalpur", label: "Jamalpur" },
      { key: "kalupur", label: "Kalupur" },
      { key: "dariyapur", label: "Dariyapur" },
      { key: "shahpur", label: "Shahpur" },
      { key: "vatva", label: "Vatva" },
    ],
    offers: [
      { key: "pehle20", label: "Pehle order pe 20% OFF", sub: "Naye customers ke liye — code: GHAR20", kind: "discount", discountType: "percent", discountValue: 20, code: "GHAR20", firstOrderOnly: true, active: true },
      { key: "bulk", label: "Bulk order? Extra discount", sub: "Mangni, party, niyaz ke liye poocho", kind: "info", discountType: "percent", discountValue: 0, code: "", firstOrderOnly: false, active: true },
    ],
    content: { about: "", privacy: "", contact: "", whatsapp: "" },
  };
  let currentTab = "cooks";
  let editingId = null;
  let pendingPhoto = { f_photo: "", f_qr: "", m_photo: "" };
  let calViewDate = new Date(); // month currently shown in calendar
  let selectedDate = todayISO();

  const SEED = {
    cooks: [
      { name: "Naseem Ben ki Rasoi", area: "Shah-e-Alam", phone: "98765 43210", status: "active" },
      { name: "Ammi's Kitchen", area: "Jamalpur", phone: "91234 56780", status: "active" },
      { name: "Ghar Ka Swaad", area: "Bapunagar", phone: "99887 66550", status: "inactive" },
    ],
    riders: [
      { name: "Faizan Sheikh", area: "Shah-e-Alam", phone: "90000 11122", status: "active" },
      { name: "Rehan Qureshi", area: "Jamalpur", phone: "90000 22233", status: "active" },
      { name: "Yusuf Malek", area: "Bapunagar", phone: "90000 33344", status: "inactive" },
    ],
    menu: [
      { name: "Gujarati Thali", cook: "Naseem Ben ki Rasoi", type: "veg", category: "thali", unit: "kg", price: 260, status: "active" },
      { name: "Chicken Handi", cook: "Ammi's Kitchen", type: "nonveg", category: "thali", unit: "kg", price: 380, status: "active" },
      { name: "Bajra Roti + Sabzi", cook: "Ghar Ka Swaad", type: "veg", category: "roti", unit: "kg", price: 180, status: "active" },
      { name: "Mande", cook: "Ahmed ke Mande", type: "veg", category: "roti", unit: "kg", price: 150, status: "active" },
      { name: "Samosa & Bread Pakoda", cook: "Rafiq Nashta Corner", type: "veg", category: "nashta", unit: "piece", price: 8, status: "active" },
      { name: "Kadak Chai", cook: "Iqbal Chai Wale", type: "veg", category: "chai", unit: "cup", price: 12, status: "active" },
      { name: "Mohanthal", cook: "Javed Halwai", type: "veg", category: "mithai", unit: "kg", price: 450, status: "active" },
    ],
  };

  // Seeds a collection ONLY if it's completely empty (first run). Safe to leave in —
  // it never overwrites or duplicates once real data exists.
  async function seedIfEmpty(collectionName){
    const snap = await db.collection(collectionName).limit(1).get();
    if(snap.empty){
      const batch = db.batch();
      SEED[collectionName].forEach(item => {
        const ref = db.collection(collectionName).doc();
        batch.set(ref, item);
      });
      await batch.commit();
    }
  }

  // Live listeners — any change in Firestore (from admin, cook panel, or website)
  // updates `data` and re-renders automatically, in real time.
  function initFirestoreListeners(){
    ["cooks", "riders", "menu"].forEach(collectionName => {
      db.collection(collectionName).onSnapshot(snapshot => {
        data[collectionName] = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        if(currentTab === collectionName) render();
      }, err => showFirestoreError(err));
    });
    let ordersLoadedOnce = false;
    db.collection("orders").onSnapshot(snapshot => {
      if(ordersLoadedOnce){
        const newPending = snapshot.docChanges().some(c => c.type === "added" && c.doc.data().status === "Pending");
        // Also alert when a cook moves an order forward (Cooking / Ready...) so
        // admin can track progress without keeping the Orders tab open.
        const cookProgress = snapshot.docChanges().some(c =>
          c.type === "modified" && (c.doc.data().status === "Cooking" || (c.doc.data().status || "").startsWith("Ready"))
        );
        if(newPending || cookProgress) playAlertSound();
      }
      data.orders = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      if(currentTab === "orders"){ renderCalendar(); renderOrdersList(); }
      ordersLoadedOnce = true;
    }, err => showFirestoreError(err));
    db.collection("settings").doc("payment").onSnapshot(doc => {
      settings.qrUrl = doc.exists ? (doc.data().qrUrl || "") : "";
      if(currentTab === "settings") renderSettings();
    }, err => showFirestoreError(err));
    db.collection("settings").doc("catalog").onSnapshot(doc => {
      if(doc.exists){
        const d = doc.data();
        if(d.categories && d.categories.length) settings.categories = d.categories;
        if(d.units && d.units.length) settings.units = d.units;
        if(d.occasions && d.occasions.length) settings.occasions = d.occasions;
        if(d.events && d.events.length) settings.events = d.events;
        if(d.localities && d.localities.length) settings.localities = d.localities;
        if(d.offers && d.offers.length) settings.offers = d.offers;
      } else {
        // First run — seed the catalog doc with the defaults above.
        db.collection("settings").doc("catalog").set({
          categories: settings.categories, units: settings.units,
          occasions: settings.occasions, events: settings.events,
          localities: settings.localities, offers: settings.offers,
        }).catch(()=>{});
      }
      if(currentTab === "settings") renderSettings();
    }, err => showFirestoreError(err));
    db.collection("settings").doc("content").onSnapshot(doc => {
      if(doc.exists) settings.content = { about: "", privacy: "", contact: "", whatsapp: "", ...doc.data() };
      if(currentTab === "settings") renderSettings();
    }, err => showFirestoreError(err));
  }

  function showFirestoreError(err){

  }

  function slugify(text){
    return text.trim().toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || ("item" + Date.now());
  }

  function saveCatalog(){
    if(!window.FIREBASE_CONFIGURED){
      showToast("Update ho gaya (local demo, save nahi hoga)");
      renderSettings();
      return;
    }
    db.collection("settings").doc("catalog").set({
      categories: settings.categories, units: settings.units,
      occasions: settings.occasions, events: settings.events,
      localities: settings.localities, offers: settings.offers,
    })
      .then(() => showToast("Update ho gaya ✓"))
      .catch(err => showToast("Error: " + err.message));
    renderSettings();
  }

  function addCategory(){
    const input = document.getElementById("newCategoryInput");
    const label = input.value.trim();
    if(!label){ showToast("Category ka naam likho"); return; }
    const key = slugify(label);
    if(settings.categories.some(c => c.key === key)){ showToast("Ye category pehle se hai"); return; }
    settings.categories.push({ key, label, estimateMode: "normal" });
    saveCatalog();
  }

  function removeCategory(key){
    if(settings.categories.length <= 1){ showToast("Kam se kam ek category rehni chahiye"); return; }
    settings.categories = settings.categories.filter(c => c.key !== key);
    saveCatalog();
  }

  function setCategoryEstimateMode(key, mode){
    const cat = settings.categories.find(c => c.key === key);
    if(cat) cat.estimateMode = mode;
    saveCatalog();

  // Compresses/resizes a picked image so it stays well under Firestore's ~1MB
  // per-document limit (phone camera photos are often 2-8MB otherwise).
  function compressImageFile(file, maxDim = 640, quality = 0.7){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = reject;
      reader.onload = e => {
        const img = new Image();
        img.onerror = reject;
        img.onload = () => {
          let { width, height } = img;
          if(width > height && width > maxDim){ height = Math.round(height * (maxDim / width)); width = maxDim; }
          else if(height > maxDim){ width = Math.round(width * (maxDim / height)); height = maxDim; }
          const canvas = document.createElement("canvas");
          canvas.width = width; canvas.height = height;
          canvas.getContext("2d").drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function renderCalendar(){
    const box = document.getElementById("calendarBox");
    const year = calViewDate.getFullYear();
    const month = calViewDate.getMonth();
    const firstDay = new Date(year, month, 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();
    const todayStr = todayISO();

    let cells = "";
    for(let i = startOffset - 1; i >= 0; i--){
      cells += `<div class="cal-day other-month">${daysInPrevMonth - i}</div>`;
    }
    for(let day = 1; day <= daysInMonth; day++){
      const iso = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
      const dayOrders = data.orders.filter(o => o.date === iso);
      const hasPending = dayOrders.some(o => o.status === "Pending");
      const hasConfirmed = dayOrders.some(o => o.status === "Confirmed");
      let dot = "";
      if(hasPending) dot = `<span class="cal-dot pending"></span>`;
      else if(hasConfirmed) dot = `<span class="cal-dot confirmed"></span>`;
      cells += `<div class="cal-day ${iso === todayStr ? "today" : ""} ${iso === selectedDate ? "selected" : ""}" onclick="selectDate('${iso}')">${day}${dot}</div>`;
    }
    const totalCells = startOffset + daysInMonth;
    const trailing = (7 - (totalCells % 7)) % 7;
    for(let i = 1; i <= trailing; i++){
      cells += `<div class="cal-day other-month">${i}</div>`;
    }

    box.innerHTML = `
      <div class="cal-box">
        <div class="cal-head">
          <div class="cal-nav" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></div>
          <b>${MONTH_NAMES[month]} ${year}</b>
          <div class="cal-nav" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></div>
        </div>
        <div class="cal-grid">
          ${DOW.map(d => `<div class="cal-dow">${d}</div>`).join("")}
          ${cells}
        </div>
      </div>
    `;
  }

  function saveEntry(){
    const name = document.getElementById("f_name").value.trim();
    const area = document.getElementById("f_area").value.trim();
    const phone = document.getElementById("f_phone").value.trim();
    const status = document.getElementById("f_status").value;

    const errorBox = document.getElementById("formError");
    if(!name || !area || !phone){
      errorBox.textContent = "Naam, area aur phone — teeno bharna zaroori hai.";
      errorBox.style.display = "block";
      return;
    }
    errorBox.style.display = "none";

    // Dishes store the cook's name as plain text (not a linked ID), so if a cook
    // gets renamed we need to update that name on their existing dishes too —
    // otherwise the cook panel / customer site stop matching them.
    const oldName = (currentTab === "cooks" && editingId)
      ? (data.cooks.find(i => i.id === editingId) || {}).name
      : null;

    const payload = { name, area, phone, status, photoUrl: pendingPhoto.f_photo || "" };
    if(currentTab === "cooks") payload.qrUrl = pendingPhoto.f_qr || "";

    if(!window.FIREBASE_CONFIGURED){
      if(editingId){
        Object.assign(data[currentTab].find(i => i.id === editingId), payload);
      } else {
        data[currentTab].push({ id: "local" + Date.now(), ...payload });
      }
      if(oldName && oldName !== name){
        data.menu.forEach(m => { if(m.cook === oldName) m.cook = name; });
      }
      showToast((editingId ? "Update" : "Add") + " ho gaya (local demo, save nahi hoga)");
      closeModal();
      render();
      return;
    }

    const promise = editingId
      ? db.collection(currentTab).doc(editingId).update(payload)
      : db.collection(currentTab).add(payload);

    promise
      .then(() => {
        showToast(editingId ? "Update ho gaya ✓" : "Add ho gaya ✓");
        if(oldName && oldName !== name) cascadeCookRename(oldName, name);
      })
      .catch(err => showToast("Error: " + err.message));
    closeModal();
  }

  function cascadeCookRename(oldName, newName){
    db.collection("menu").where("cook", "==", oldName).get().then(snapshot => {
      if(snapshot.empty) return;
      const batch = db.batch();
      snapshot.docs.forEach(doc => batch.update(doc.ref, { cook: newName }));
      batch.commit()
        .then(() => showToast(`${snapshot.size} dish ka cook naam bhi update ho gaya ✓`))
        .catch(err => showToast("Dishes update karne mein error: " + err.message));
    }).catch(err => console.error("Cascade rename failed:", err));
  }

  // Dependency-free alert beep — plays when a new order comes in, while this tab
  // is open. No push-notification infra (service worker / paid plan) needed.
  function playAlertSound(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = "sine"; o.frequency.value = 880;
      g.gain.setValueAtTime(0.001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
      o.start(); o.stop(ctx.currentTime + 0.35);
    } catch(e){ /* audio not available — ignore */ }
  }

        <button class="btn btn-ghost" style="flex:1;" onclick="copyShareLink('${url}')"><i class="fa-solid fa-copy"></i> Copy Link</button>
      </div>
      <div class="modal-actions"><button class="btn btn-ghost" style="flex:1;" onclick="document.getElementById('qrOverlay').classList.remove('open')">Band karo</button></div>
    `;
    new QRCode(document.getElementById("qrCanvasBox"), { text: url, width: 180, height: 180, colorDark: "#2B1B17", colorLight: "#FBF3E7" });
    document.getElementById("qrOverlay").classList.add("open");
  }

  function nativeShare(url, title){
    if(navigator.share){
      navigator.share({ title: title || "GharKaKhana", url }).catch(() => {});
    } else {
      copyShareLink(url);
    }
  }

  function copyShareLink(url){
    navigator.clipboard.writeText(url).then(() => showToast("Link copy ho gaya"))
      .catch(() => showToast("Copy nahi ho paya — manually select karke copy karo"));
  }

  // ---------- "Install App" (Add to Home Screen) ----------
  let deferredInstallPrompt = null;
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferredInstallPrompt = e;
    document.getElementById("installBtn").style.display = "flex";
  });
  window.addEventListener("appinstalled", () => {
    document.getElementById("installBtn").style.display = "none";
    deferredInstallPrompt = null;
  });
  function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
  function isStandalone(){ return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true; }

  async function installApp(){
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      document.getElementById("installBtn").style.display = "none";
      return;
    }
    const modal = document.getElementById("qrModal");
    if(isIOS()){
      modal.innerHTML = `
        <h3>App Install Karo</h3>
        <p style="font-size:12.5px; color:var(--text-soft); line-height:1.7; margin-bottom:14px;">
          1. Neeche <i class="fa-solid fa-arrow-up-from-bracket"></i> <b>Share</b> button dabao<br>
          2. <b>"Add to Home Screen"</b> chuno<br>
          3. <b>"Add"</b> dabao
        </p>
        <div class="modal-actions"><button class="btn btn-primary" style="flex:1;" onclick="document.getElementById('qrOverlay').classList.remove('open')">Theek hai</button></div>
      `;
    } else {
      modal.innerHTML = `
        <h3>App Install Karo</h3>
        <p style="font-size:12.5px; color:var(--text-soft); line-height:1.7; margin-bottom:14px;">
          1. Upar-right <b>⋮ (3-dot) menu</b> dabao<br>
          2. <b>"Add to Home Screen"</b> ya <b>"Install app"</b> chuno<br>
          3. Confirm karo — icon home screen pe aa jayega
        </p>
        <div class="modal-actions"><button class="btn btn-primary" style="flex:1;" onclick="document.getElementById('qrOverlay').classList.remove('open')">Theek hai</button></div>
      `;
    }
    document.getElementById("qrOverlay").classList.add("open");
  }
  if(isStandalone()){ document.getElementById("installBtn").style.display = "none"; }

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => navigator.serviceWorker.register("sw-admin.js").catch(() => {}));
  }

  function showToast(msg){
    const toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    setTimeout(()=> toast.classList.remove("show"), 1800);
  }

  render();
</script>

</body>
</html>
